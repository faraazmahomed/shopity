{% extends 'base.html' %}
{% block title %}Password Reset Complete - Shopity{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <div class="card shadow-sm text-center p-4">
        <div class="card-body">
            <h3 class="card-title text-success mb-3">Password Reset Complete</h3>
            <p class="text-muted">Your password has been successfully set. You may now log in with your new credentials.</p>
            <a href="{% url 'login' %}" class="btn btn-primary mt-3">Log In Now</a>
        </div>
    </div>
</div>
{% endblock %}
