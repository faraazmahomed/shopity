{% extends 'base.html' %}
{% block title %}Reset Password - Shopity{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 450px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-3">Reset Password</h3>
            <p class="text-muted text-center small mb-4">Enter your email address below, and we'll email you instructions for setting a new password.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-3">Send Reset Link</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
