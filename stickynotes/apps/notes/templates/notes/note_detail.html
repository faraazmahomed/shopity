<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ note.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
        .detail-card {
            max-width: 600px;
            margin: 60px auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }
        .note-yellow { background-color: #fff3a3; color: #4a4200; }
        .note-blue   { background-color: #c5eff7; color: #004b57; }
        .note-green  { background-color: #d4edda; color: #155724; }
        .note-pink   { background-color: #f8d7da; color: #721c24; }
        .note-purple { background-color: #e2d0f9; color: #43126e; }
    </style>
</head>
<body>

<div class="container">
    <div class="detail-card note-{{ note.color }}">
        <div class="d-flex justify-content-between align-items-start mb-3">
            <h2 class="fw-bold mb-0">{{ note.title }}</h2>
            {% if note.is_pinned %}<span>📌</span>{% endif %}
        </div>

        <hr>

        <p class="fs-5" style="white-space: pre-wrap;">{{ note.content }}</p>

        <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
            <small class="text-muted">Created: {{ note.created_at|date:"F j, Y, g:i a" }}</small>
            <div>
                <a href="{% url 'note_list' %}" class="btn btn-outline-dark btn-sm">Back</a>
                <a href="{% url 'note_update' note.pk %}" class="btn btn-dark btn-sm ms-1">Edit</a>
                <a href="{% url 'note_delete' note.pk %}" class="btn btn-danger btn-sm ms-1">Delete</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
