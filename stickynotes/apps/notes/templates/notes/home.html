<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sticky Notes App</title>
</head>
<body>
    <h1>My Sticky Notes</h1>
    
    <a href="{% url 'admin:index' %}">Go to Admin</a>
    <hr>

    {% if notes %}
        <ul>
        {% for note in notes %}
            <li>
                <h3>{{ note.title }}</h3>
                <p>{{ note.content }}</p>
                <small>Created: {{ note.created_at }}</small>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No sticky notes found yet!</p>
    {% endif %}
</body>
</html>
