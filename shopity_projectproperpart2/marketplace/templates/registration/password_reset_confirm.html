{% extends 'base.html' %}
{% block title %}Enter New Password - Shopity{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 450px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Set New Password</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 mt-3">Change Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
