{% extends 'base.html' %}

{% block title %}Reset Password - Shopity{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 450px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-3">Reset Password</h3>
            <p class="text-muted text-center small mb-4">Enter your account email address below, and we'll email you a secure link to set a new password.</p>
            <form enctype="multipart/form-data" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_email" class="form-label">Email Address</label>
                    <input type="email" name="email" id="id_email" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">Send Reset Link</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="small text-decoration-none">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
