{% extends 'base.html' %}

{% block title %}Delete Product{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Confirm Delete</h4>
            </div>
            <div class="card-body text-center">
                <p class="fs-5">Are you sure you want to delete <strong>"{{ product.title }}"</strong>?</p>
                <p class="text-muted small">This action cannot be undone.</p>
                
                <form enctype="multipart/form-data" method="post" class="mt-4">
                    {% csrf_token %}
                    <a href="{% url 'vendor_product_list' %}" class="btn btn-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-danger">Yes, Delete Product</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
