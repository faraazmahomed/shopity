{% extends "base.html" %}

{% block title %}Delete Product - {{ product.name }}{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <div class="card border-danger shadow-sm">
        <div class="card-body p-4">
            <h4 class="card-title text-danger mb-3">Confirm Deletion</h4>
            <p class="card-text">Are you sure you want to delete <strong>{{ product.name }}</strong>? This action cannot be undone.</p>
            <form enctype="multipart/form-data" method="post" class="mt-4">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'vendor_dashboard' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
