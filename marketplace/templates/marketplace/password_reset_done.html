{% extends 'base.html' %}

{% block title %}Email Sent - Shopity{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <div class="card shadow-sm text-center p-4">
        <div class="card-body">
            <h3 class="card-title text-success mb-3">Check Your Inbox</h3>
            <p class="text-muted">We've generated a password reset link and sent it to your email. If an account matches the address you entered, you will receive instructions shortly.</p>
            <a href="{% url 'login' %}" class="btn btn-outline-primary mt-3">Return to Login</a>
        </div>
    </div>
</div>
{% endblock %}
